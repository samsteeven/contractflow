name: contractflow

services:
  postgres:
    image: postgres:18-alpine
    container_name: contractflow-postgres
    environment:
      POSTGRES_USER: contractflow
      POSTGRES_PASSWORD: contractflow
      POSTGRES_DB: contractflow
    ports:
      - '127.0.0.1:${DB_PORT:-5438}:5432'
    volumes:
      # PostgreSQL 18 range ses données dans un sous-dossier versionné de /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      # Crée aussi la base des tests (contractflow_test) au premier démarrage.
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contractflow -d contractflow']
      interval: 3s
      timeout: 3s
      retries: 20

  # Stockage compatible S3 pour les PDF en local (le bucket est créé au démarrage) ;
  # la production vise AWS S3. Les données sont perdues à l'arrêt du conteneur : c'est voulu.
  s3:
    image: adobe/s3mock:latest
    container_name: contractflow-s3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: contractflow-documents
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: eu-west-3
    ports:
      - '127.0.0.1:${S3_PORT:-9008}:9090'

  # File de tâches des rappels (BullMQ).
  redis:
    image: redis:7-alpine
    container_name: contractflow-redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6389}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # Boîte de réception de développement : les rappels s'y affichent, rien ne part vraiment.
  mailpit:
    image: axllent/mailpit:latest
    container_name: contractflow-mailpit
    ports:
      - '127.0.0.1:${SMTP_PORT:-1035}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8035}:8025'

  # Antivirus des pièces jointes (clamd). Premier démarrage : une à deux minutes, le temps de
  # charger les signatures ; l'état « healthy » dit quand il répond.
  clamav:
    image: clamav/clamav:stable
    container_name: contractflow-clamav
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    environment:
      CLAMAV_NO_FRESHCLAMD: 'false'
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # --- Application complète (profil « app ») : `docker compose --profile app up --build` ---
  # La même image qu'en production. Les services ci-dessus restent seuls par défaut, pour le
  # développement avec `npm run dev`.
  migrate:
    profiles: ['app']
    build: .
    image: contractflow:local
    command: ['node', 'ace', 'migration:run', '--force']
    environment: &app-env
      NODE_ENV: production
      APP_KEY: ${APP_KEY:-local-only-key-local-only-key-local-only-key}
      APP_URL: http://localhost:${APP_PORT:-3340}
      HOST: 0.0.0.0
      PORT: '3333'
      LOG_LEVEL: info
      SESSION_DRIVER: cookie
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: contractflow
      DB_PASSWORD: contractflow
      DB_DATABASE: contractflow
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      DRIVE_DISK: s3
      S3_BUCKET: contractflow-documents
      S3_ENDPOINT: http://s3:9090
      AWS_REGION: eu-west-3
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SIGNATURE_PROVIDER: sandbox
      SIGNATURE_WEBHOOK_SECRET: ${SIGNATURE_WEBHOOK_SECRET:-local-only-webhook-secret-local-only}
      MAIL_MAILER: smtp
      MAIL_FROM_NAME: ContractFlow
      MAIL_FROM_ADDRESS: contrats@contractflow.test
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ['app']
    image: contractflow:local
    environment: *app-env
    ports:
      - '127.0.0.1:${APP_PORT:-3340}:3333'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      s3:
        condition: service_started

  # Envoi des rappels : un processus à part, comme en production.
  worker:
    profiles: ['app']
    image: contractflow:local
    command: ['node', 'ace', 'queue:work']
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
