name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contractflow
          POSTGRES_PASSWORD: contractflow
          POSTGRES_DB: contractflow_test
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U contractflow -d contractflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Configuration
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Types et lint
        run: |
          npm run typecheck
          npm run lint

      - name: Tests (PostgreSQL réel)
        run: npm test

      - name: Construction de production
        run: npm run build
